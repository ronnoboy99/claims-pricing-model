name: Unzip Flick
on:
  workflow_dispatch:
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flick-apk-build
      - name: Extract Flick project to repo root
        run: |
          unzip -o flick-final_0_sjlq.zip
          ls -la Flick
          cp -a Flick/. .
          rm -rf Flick
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Temp: extract Flick project to repo root" || echo "nothing to commit"
          git push
